<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Product Verification | Teyza Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#087f5b;--ink:#12352a;--muted:#6d7d76;--line:#dce8e1;--bg:#f4f8f5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.admin-shell{max-width:1400px;margin:auto;padding:28px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.admin-head h1{margin:0;font-size:32px}.admin-head p{margin:6px 0 0;color:var(--muted)}
.badge{display:inline-flex;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#e5f5eb;color:#08734f}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-weight:750;cursor:pointer}.admin-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.admin-status{padding:12px 14px;background:#fff3f1;color:#a32a20;border:1px solid #efcbc6;border-radius:14px;margin-bottom:16px}
.admin-grid{display:grid;gap:18px}.product-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:230px 1fr;gap:22px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;background:#edf2ef}.gallery .empty{grid-column:1/-1;min-height:180px;display:grid;place-items:center;background:#f1f4f2;border-radius:14px;color:var(--muted)}
.product-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.product-top h2{margin:6px 0 6px;font-size:23px}.seller{font-size:13px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.meta div{background:#f6f9f7;padding:11px;border-radius:12px}.meta small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em;margin-bottom:5px}.meta strong{font-size:13px}
.channels{display:flex;gap:7px;flex-wrap:wrap}.channel{background:#e7f5ec;color:#086c48;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}
.review-box{margin-top:18px;border-top:1px solid #e8efeb;padding-top:18px}.review-box textarea{width:100%;min-height:78px;border:1px solid #cfded6;border-radius:13px;padding:12px;font:inherit;resize:vertical}
.actions{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.approve{background:var(--green);color:#fff}.reject{background:#fff0ee;color:#a52b22;border:1px solid #ecc5c1}.btn:disabled{opacity:.55}
.empty-state{background:#fff;border:1px solid var(--line);border-radius:20px;padding:50px;text-align:center;color:var(--muted)}
@media(max-width:850px){.product-card{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.admin-shell{padding:16px}}
</style>
</head>
<body>
<main class="admin-shell">
<header class="admin-head"><div><span class="badge">TEYZA ADMIN</span><h1>Product verification</h1><p>Review seller products before they can publish to Teyza or external channels.</p></div><strong data-admin-user></strong></header>
<div class="admin-tabs">
<button class="admin-tab active" data-filter="pending">Pending <span data-count-pending>0</span></button>
<button class="admin-tab" data-filter="approved">Approved <span data-count-approved>0</span></button>
<button class="admin-tab" data-filter="rejected">Rejected <span data-count-rejected>0</span></button>
<button class="admin-tab" data-filter="all">All <span data-count-all>0</span></button>
</div>
<div class="admin-status" data-admin-status hidden></div>
<section class="admin-grid" data-admin-products><div class="empty-state">Loading products…</div></section>
</main>
<script type="module" src="js/admin-products.js?v=1"></script>
</body>
</html>
