name: Teyza Shopper APK

on:
  pull_request:
    paths:
      - 'apps/teyza_shopper/**'
      - '.github/workflows/teyza-shopper-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP discovery endpoints
        run: |
          php -l api/shopper-discover.php
          php -l api/shopper-google-places-provider.php
          php -l api/shopper-place-photo.php
          php -l api/shopper-catalog.php
          php -l api/workspace.php
          php -l api/chat.php
      - name: Verify required website presentation assets
        run: |
          test -s assets/shop-first.css
          test -s assets/auth.css
          test -s assets/landing-popup.css
          test -s assets/workspace.css
          test -s assets/teyza-icon.svg
          test -s assets/teyza-shopper-preview.svg
          python3 - <<'PY'
          from pathlib import Path
          import re
          for document in ["index.html", "dashboard.html"]:
              source = Path(document).read_text(encoding="utf-8")
              for url in re.findall(r'(?:href|src)=["\\\'](assets/[^"\\\']+)', source):
                  asset = Path(url.split("?")[0])
                  if not asset.is_file() or asset.stat().st_size == 0:
                      raise SystemExit(f"{document} references missing asset: {asset}")
          print("Required landing and dashboard assets exist.")
          PY
      - name: Package 0.9 Teyza website patch
        run: |
          mkdir -p deploy/api deploy/js deploy/assets
          cp api/workspace.php api/shopper-catalog.php api/chat.php deploy/api/
          cp index.html dashboard.html seller-subscriptions.html deploy/
          cp js/seller-subscriptions.js deploy/js/
          cp assets/shop-first.css assets/auth.css assets/landing-popup.css assets/workspace.css assets/teyza-icon.svg assets/teyza-shopper-preview.svg deploy/assets/
          cp docs/TEYZA_0.9_RELEASE_AND_SUBSCRIPTIONS.md deploy/SETUP.md
          (cd deploy && zip -q -r ../TEYZA_SHOPPER_0.9_WEBSITE_PATCH.zip api js assets index.html dashboard.html seller-subscriptions.html SETUP.md)
          unzip -t TEYZA_SHOPPER_0.9_WEBSITE_PATCH.zip
      - name: Upload website update
        uses: actions/upload-artifact@v4
        with:
          name: teyza-shopper-0-9-website-patch
          path: TEYZA_SHOPPER_0.9_WEBSITE_PATCH.zip
          retention-days: 14
      - name: Package standalone CSS recovery ZIP
        run: |
          mkdir -p repair/assets
          cp index.html dashboard.html repair/
          cp assets/shop-first.css assets/auth.css assets/landing-popup.css assets/workspace.css assets/teyza-icon.svg assets/teyza-shopper-preview.svg repair/assets/
          cp docs/TEYZA_0.9_STYLE_RECOVERY.md repair/README-DEPLOY-FIRST.md
          (cd repair && zip -q -r ../TEYZA_0.9_STYLE_RECOVERY.zip index.html dashboard.html assets README-DEPLOY-FIRST.md)
          unzip -t TEYZA_0.9_STYLE_RECOVERY.zip
      - name: Upload standalone CSS recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: teyza-0-9-css-recovery
          path: TEYZA_0.9_STYLE_RECOVERY.zip
          retention-days: 14
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper for shopper
        working-directory: apps/teyza_shopper
        run: flutter create --platforms=android --org za.co.teyza --project-name teyza_shopper .
      - name: Remove Flutter template widget test
        working-directory: apps/teyza_shopper
        run: rm -f test/widget_test.dart
      - name: Create TEYZA launcher icons
        working-directory: apps/teyza_shopper
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_launcher_icon.py
          sed -i 's/android:label="teyza_shopper"/android:label="TEYZA Shopper"/' android/app/src/main/AndroidManifest.xml
      - name: Enable release internet access
        working-directory: apps/teyza_shopper
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          grep INTERNET android/app/src/main/AndroidManifest.xml
      - name: Packages
        working-directory: apps/teyza_shopper
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/teyza_shopper
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: apps/teyza_shopper
        run: flutter test
      - name: Build shopper debug APK
        working-directory: apps/teyza_shopper
        env:
          TEYZA_GOOGLE_WEB_CLIENT_ID: ${{ vars.TEYZA_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --debug --dart-define=TEYZA_GOOGLE_WEB_CLIENT_ID="$TEYZA_GOOGLE_WEB_CLIENT_ID"
      - name: Build smaller Android ARM64 test APK
        working-directory: apps/teyza_shopper
        env:
          TEYZA_GOOGLE_WEB_CLIENT_ID: ${{ vars.TEYZA_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=TEYZA_GOOGLE_WEB_CLIENT_ID="$TEYZA_GOOGLE_WEB_CLIENT_ID"
      - name: Upload smaller APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teyza-shopper-arm64-test-apk
          path: apps/teyza_shopper/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
      - name: Upload APK for real-device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teyza-shopper-spaza-debug-apk
          path: apps/teyza_shopper/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
