name: Teyza Shopper APK

on:
  pull_request:
    paths:
      - 'apps/teyza_shopper/**'
      - '.github/workflows/teyza-shopper-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP discovery endpoints
        run: |
          php -l api/shopper-discover.php
          php -l api/shopper-google-places-provider.php
          php -l api/shopper-place-photo.php
          php -l api/shopper-catalog.php
          php -l api/workspace.php
          php -l api/business-logo.php
          php -l api/verification-upload.php
          php -l api/chat.php
      - name: Validate category signup JavaScript modules
        run: |
          for file in js/landing-auth.js js/guard.js js/retailer-dashboard.js js/admin-sellers.js js/dashboard-data.js js/onboarding-v2.js js/business-profile.js js/spaza-activation.js; do
            node --input-type=module --check < "$file"
          done
          test -s retailer-dashboard.html
          test -s seller-activation.html
          test -s teyza-release-check.html
          ! grep -q 'id="teyzaOnboarding"' dashboard.html
          grep -q 'SPAZA_QUICK_SETUP_20261020' dashboard.html
          grep -q 'seller-activation.html' js/guard.js
          test -s business-profile.html
          test -s assets/spaza-onboarding.css
          test -s docs/TEYZA_1.0_SELLER_CATEGORIES.md
      - name: Verify growing Y brand assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for file in [
              "assets/teyza-logo.svg",
              "assets/teyza-icon.svg",
              "assets/teyza-sprout-wordmark.svg",
              "assets/teyza-sprout-wordmark-light.svg",
              "apps/teyza_shopper/assets/brand/teyza-sprout-wordmark-light.svg",
              "apps/teyza_shopper/assets/brand/teyza-sprout-icon.svg",
          ]:
              ElementTree.parse(file)
              print("Valid SVG:", file)
          PY
          grep -q "assets/brand/teyza-sprout-wordmark-light.svg" apps/teyza_shopper/pubspec.yaml
          grep -q "assets/brand/teyza-sprout-icon.svg" apps/teyza_shopper/pubspec.yaml
      - name: Verify required website presentation assets
        run: |
          test -s assets/shop-first.css
          test -s assets/auth.css
          test -s assets/landing-popup.css
          test -s assets/workspace.css
          test -s assets/teyza-icon.svg
          test -s assets/teyza-sprout-wordmark.svg
          test -s assets/teyza-sprout-wordmark-light.svg
          test -s assets/teyza-shopper-preview.svg
          python3 - <<'PY'
          from pathlib import Path
          import re
          for document in ["index.html", "dashboard.html", "business-profile.html", "seller-activation.html", "retailer-dashboard.html", "seller-subscriptions.html"]:
              source = Path(document).read_text(encoding="utf-8")
              for url in re.findall(r'(?:href|src)=["\\\'](assets/[^"\\\']+)', source):
                  asset = Path(url.split("?")[0])
                  if not asset.is_file() or asset.stat().st_size == 0:
                      raise SystemExit(f"{document} references missing asset: {asset}")
          print("Required landing and dashboard assets exist.")
          PY
      - name: Package TEYZA simplified Spaza seller onboarding website
        run: |
          mkdir -p deploy/api deploy/js deploy/assets
          cp api/workspace.php api/business-logo.php api/verification-upload.php deploy/api/
          cp js/landing-auth.js js/guard.js js/retailer-dashboard.js js/admin-sellers.js js/dashboard-data.js js/onboarding-v2.js js/business-profile.js js/spaza-activation.js deploy/js/
          cp index.html dashboard.html business-profile.html seller-activation.html retailer-dashboard.html admin-sellers.html seller-subscriptions.html teyza-release-check.html deploy/
          cp assets/spaza-onboarding.css assets/auth.css assets/shop-first.css assets/landing-popup.css assets/workspace.css assets/teyza-icon.svg assets/teyza-logo.svg assets/teyza-sprout-wordmark.svg assets/teyza-sprout-wordmark-light.svg assets/teyza-shopper-preview.svg deploy/assets/
          cp docs/TEYZA_SPAZA_SIMPLE_ONBOARDING.md deploy/README-INSTALL.md
          (cd deploy && zip -q -r ../TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip api js assets index.html dashboard.html business-profile.html seller-activation.html retailer-dashboard.html admin-sellers.html seller-subscriptions.html teyza-release-check.html README-INSTALL.md)
          unzip -t TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'assets/shop-first.css'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'assets/teyza-sprout-wordmark-light.svg'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'seller-subscriptions.html'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'retailer-dashboard.html'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'seller-activation.html'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'teyza-release-check.html'
          unzip -Z1 TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip | grep -qx 'assets/spaza-onboarding.css'
      - name: Upload fresh brand website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: teyza-spaza-quick-setup-r2-website
          path: TEYZA_SPAZA_QUICK_SETUP_R2_WEBSITE.zip
          retention-days: 14
      - name: Package standalone CSS recovery ZIP
        run: |
          mkdir -p repair/assets
          cp index.html dashboard.html repair/
          cp assets/shop-first.css assets/auth.css assets/landing-popup.css assets/workspace.css assets/teyza-icon.svg assets/teyza-logo.svg assets/teyza-sprout-wordmark.svg assets/teyza-sprout-wordmark-light.svg assets/teyza-shopper-preview.svg repair/assets/
          cp docs/TEYZA_0.9_STYLE_RECOVERY.md repair/README-DEPLOY-FIRST.md
          (cd repair && zip -q -r ../TEYZA_1.1_STYLE_AND_BRAND_RECOVERY.zip index.html dashboard.html assets README-DEPLOY-FIRST.md)
          unzip -t TEYZA_1.1_STYLE_AND_BRAND_RECOVERY.zip
      - name: Upload standalone CSS recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: teyza-1-1-style-brand-recovery
          path: TEYZA_1.1_STYLE_AND_BRAND_RECOVERY.zip
          retention-days: 14
      - name: Validate R3.4 premium shop images and Google Places backend syntax
        run: |
          node --check services/teyza-places-v34/index.js
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          directory=Path("apps/teyza_shopper/assets/illustrations")
          expected={"shop-front.svg","grocery-basket.svg",
            "bread.svg","milk.svg","eggs.svg","rice.svg",
            "maize.svg","oil.svg","snacks.svg","soap.svg"}
          missing=expected-{p.name for p in directory.glob("*.svg")}
          assert not missing, f"Missing shopper art: {sorted(missing)}"
          for filename in expected:
              ElementTree.parse(directory/filename)
          print("Premium SVG illustrations: valid")
          PY
          grep -q 'assets/illustrations/' apps/teyza_shopper/pubspec.yaml
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper for shopper
        working-directory: apps/teyza_shopper
        run: flutter create --platforms=android --org za.co.teyza --project-name teyza_shopper .
      - name: Remove Flutter template widget test
        working-directory: apps/teyza_shopper
        run: rm -f test/widget_test.dart
      - name: Create TEYZA launcher icons
        working-directory: apps/teyza_shopper
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 scripts/make_launcher_icon.py
          sed -i 's/android:label="teyza_shopper"/android:label="TEYZA Shopper"/' android/app/src/main/AndroidManifest.xml
      - name: Enable release internet access
        working-directory: apps/teyza_shopper
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          grep INTERNET android/app/src/main/AndroidManifest.xml
      - name: Packages
        working-directory: apps/teyza_shopper
        run: flutter pub get
      - name: Static analysis
        working-directory: apps/teyza_shopper
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: apps/teyza_shopper
        run: flutter test
      - name: Build shopper debug APK
        working-directory: apps/teyza_shopper
        env:
          TEYZA_GOOGLE_WEB_CLIENT_ID: ${{ vars.TEYZA_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --debug --dart-define=TEYZA_GOOGLE_WEB_CLIENT_ID="$TEYZA_GOOGLE_WEB_CLIENT_ID"
      - name: Build smaller Android ARM64 test APK
        working-directory: apps/teyza_shopper
        env:
          TEYZA_GOOGLE_WEB_CLIENT_ID: ${{ vars.TEYZA_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=TEYZA_GOOGLE_WEB_CLIENT_ID="$TEYZA_GOOGLE_WEB_CLIENT_ID"
      - name: Upload smaller APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teyza-shopper-arm64-test-apk
          path: apps/teyza_shopper/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
      - name: Upload APK for real-device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teyza-shopper-spaza-debug-apk
          path: apps/teyza_shopper/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
