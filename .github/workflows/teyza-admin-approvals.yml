name: Teyza operations admin R319

on:
  push:
    branches:
      - feat/teyza-free-signup-paystack-products-promotion-20261104
    paths:
      - 'web/teyza-admin/**'
      - 'tools/admin-release/**'
      - 'services/teyza-mobile-v39/**'
      - 'docs/TEYZA_PAYSTACK_ADMIN_R321.md'
      - '.github/workflows/teyza-admin-approvals.yml'
  pull_request:
    paths:
      - 'web/teyza-admin/**'
      - 'tools/admin-release/**'
      - 'scripts/package_teyza_admin.py'
      - 'scripts/package_operations_admin.py'
      - 'tools/paystack/**'
      - 'services/teyza-mobile-v39/**'
      - 'DEPLOY-OPERATIONS.ps1'
      - 'docs/TEYZA_R319_ADMIN_USERS.md'
      - 'docs/TEYZA_R316_ADMIN_APPROVALS.md'
      - '.github/workflows/teyza-admin-approvals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/admin-release/package-lock.json
      - name: Install pinned deployment and browser tooling
        working-directory: tools/admin-release
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse scoped Paystack admin Bash deploy helper
        run: bash -n DEPLOY-PAYSTACK-ADMIN.sh
      - name: Exercise isolated Paystack sandbox harness with mock responses
        run: node --test tools/paystack/sandbox-check.test.cjs
      - name: Validate admin modules, Hosting preservation and reviewer role handling
        working-directory: tools/admin-release
        run: |
          npm test
          node --input-type=module --check < ../../web/teyza-admin/public/js/teyza-app-admin.js
          node --input-type=module --check < ../../web/teyza-admin/public/js/teyza-operations.js
          node --input-type=module --check < ../../web/teyza-admin/public/js/teyza-field-admin.js
          node -e "const {Client}=require('firebase-tools/lib/apiv2');const {requireAuth}=require('firebase-tools/lib/requireAuth');const {getGlobalDefaultAccount}=require('firebase-tools/lib/auth');if(typeof Client!=='function'||typeof requireAuth!=='function'||typeof getGlobalDefaultAccount!=='function')throw Error('Firebase CLI adapter changed');"
      - name: Run browser approval, privacy, session and phone layout scenarios
        working-directory: tools/admin-release
        env:
          TEYZA_ADMIN_TEST_OUTPUT: ${{ github.workspace }}/admin-previews
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Validate website seller subscription security and Hosting overlay
        run: |
          npm test --prefix tools/app-first-release
          node --input-type=module --check < web/app-first/public/js/seller-web-billing.mjs
      - name: Parse PowerShell activation helpers
        shell: pwsh
        run: |
          foreach ($file in @('DEPLOY-ADMIN.ps1','GRANT-ADMIN.ps1','ROLLBACK-ADMIN.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path "$pwd/tools/admin-release" $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/paystack/RUN-SANDBOX-CHECK.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      # Keep deployment kits unavailable while the Defender source review is pending.
      - name: Package scoped admin activation kit
        if: github.event_name == 'workflow_dispatch' && vars.TEYZA_DEPLOY_KIT_REVIEW_CLEARED == 'true'
        run: python3 scripts/package_operations_admin.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && vars.TEYZA_DEPLOY_KIT_REVIEW_CLEARED == 'true'
        with:
          name: teyza-admin-r319-users-kit
          path: TEYZA_ADMIN_R319_OPERATIONS_KIT.zip
          retention-days: 30

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix services/teyza-mobile-v39 --no-audit --no-fund
      - run: npm test --prefix services/teyza-mobile-v39
      - name: Check operations deployment command
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/DEPLOY-OPERATIONS.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          ./scripts/test_teyza_operations_deploy.ps1
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/DEPLOY-TEYZA-PAYSTACK-BACKEND.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $source=Get-Content -Raw "$pwd/DEPLOY-TEYZA-PAYSTACK-BACKEND.ps1"
          foreach ($required in @('TEYZA_SELLER_PAYSTACK_ENABLED','TEYZA_PAYSTACK_WEBHOOK_SIGNING_SECRET','functions:teyza-mobile:teyzaMobile','sellerPaystackNewCheckoutDisabled','paystackModernWebhookSignatureVerification')) {
            if (-not $source.Contains($required)) { throw ("Backend staged-deploy guard missing: " + $required) }
          }
