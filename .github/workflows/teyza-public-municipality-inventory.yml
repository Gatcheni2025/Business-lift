name: Teyza public municipality code inventory
on:
  push:
    branches:
      - 'audit/teyza-public-municipal-code-inventory-20261127'
permissions:
  contents: read
jobs:
  public_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Count every public GIS code and reconcile published merger candidates
        run: node tools/national-acquisition-validation/municipal-code-inventory.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-municipal-code-inventory
          path: national-validation/municipal-code-inventory.json
          if-no-files-found: warn
          retention-days: 30
