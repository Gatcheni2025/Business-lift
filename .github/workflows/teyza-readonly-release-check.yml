name: Teyza read-only release readiness
on:
  push:
    branches: [chore/teyza-readonly-release-check-20261105]
    paths: [.github/workflows/teyza-readonly-release-check.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public service, admin, website and search files
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin

          class Page(HTMLParser):
            def __init__(self):
              super().__init__(); self.title=''; self.in_title=False; self.headings=[]; self.heading=None
              self.meta={}; self.canonical=''; self.links=[]; self.images=[]; self.scripts=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='title': self.in_title=True
              if tag in ('h1','h2'): self.heading=[tag,'']
              if tag=='meta' and (a.get('name') or a.get('property')):
                self.meta[(a.get('name') or a.get('property')).lower()]=a.get('content','')
              if tag=='link' and 'canonical' in a.get('rel','').lower(): self.canonical=a.get('href','')
              if tag=='a' and a.get('href'): self.links.append(a['href'])
              if tag=='script' and a.get('src'): self.scripts.append(a['src'])
              if tag=='img': self.images.append({'src':a.get('src',''),'alt':a.get('alt')})
            def handle_data(self,data):
              if self.in_title: self.title+=data
              if self.heading is not None: self.heading[1]+=data
            def handle_endtag(self,tag):
              if tag=='title': self.in_title=False
              if self.heading is not None and tag==self.heading[0]:
                self.headings.append(self.heading); self.heading=None

          urls=[('MOBILE','https://us-central1-business-lift-3c19c.cloudfunctions.net/teyzaMobile'),
                ('HOME','https://teyza.co.za/'),('ADMIN','https://teyza.co.za/admin.html'),
                ('ROBOTS','https://teyza.co.za/robots.txt'),('SITEMAP','https://teyza.co.za/sitemap.xml')]
          for label,url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Teyza-public-readiness-check/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read(500000).decode('utf-8',errors='replace')
                print(label+'_HTTP '+json.dumps({'status':r.status,'final':r.geturl(),'xRobotsTag':r.headers.get('X-Robots-Tag')}))
              if label=='MOBILE':
                obj=json.loads(data)
                fields=['ok','version','billingMode','paystackCheckoutAvailable','subscriptionMonthlyCents',
                  'introductoryFirstMonthCents','adminOperations','adminReview','adminProductReview',
                  'automaticProductPublication','adminPaystackVerify','adminComplimentaryAccess',
                  'approvalRequired','sellerOnboarding','verificationUploads','addressAutocomplete']
                print('MOBILE_HEALTH '+json.dumps({k:obj.get(k) for k in fields},sort_keys=True))
              elif label in ('HOME','ADMIN'):
                page=Page(); page.feed(data)
                print(label+'_PAGE '+json.dumps({'title':page.title.strip(),
                  'description':page.meta.get('description'),'robots':page.meta.get('robots'),
                  'canonical':page.canonical,'headings':page.headings[:12],
                  'release':page.meta.get('teyza-admin-release'),
                  'images':len(page.images),'imagesMissingAlt':sum(x['alt'] is None or not x['alt'].strip() for x in page.images),
                  'links':[urljoin(r.geturl(),x) for x in page.links if any(t in x.lower() for t in ('play.google.com','apps.apple.com','testflight.apple.com','privacy','terms','mailto:','tel:','download','agents','vacanc'))],
                  'scripts':[x for x in page.scripts if 'admin' in x.lower()],
                  'markers':{m:(m.lower() in data.lower()) for m in ['Seller verification','Approvals & images','Product approvals','R323','R321','support@teyza.co.za','0315661165']}},ensure_ascii=False))
              else:
                print(label+'_CONTENT '+data[:10000].replace('\n',' '))
            except (HTTPError,URLError,TimeoutError,ValueError) as e:
              print(label+'_CHECK_FAILED '+type(e).__name__+' '+str(getattr(e,'code','')))
              if label in ('HOME','ADMIN','MOBILE'): raise SystemExit(1)
          PY
