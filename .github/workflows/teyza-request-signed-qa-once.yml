name: Teyza one-time signed QA request

on:
  push:
    branches:
      - fix/teyza-signed-qa-app-only-20261106
    paths:
      - .github/workflows/teyza-request-signed-qa-once.yml

permissions:
  actions: write
  contents: read

jobs:
  request_signed_qa:
    if: >-
      github.repository == 'Gatcheni2025/Business-lift' &&
      github.event.head_commit.message == 'ci: request app-only signed QA preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the exact checked app-only QA commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/teyza-signed-qa-app-only-20261106'
          current="$(gh api "repos/Gatcheni2025/Business-lift/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::error::The QA branch changed before dispatch; no signed build was requested.'
            exit 1
          fi
          gh workflow run teyza-mobile-release.yml --repo Gatcheni2025/Business-lift --ref "$branch" \
            -f signed_release=true -f qa_signing_only=true -f platforms=all \
            -f upload_to_testflight=false -f expected_source_sha="$GITHUB_SHA"
          echo "Requested a QA-only signed build from commit $GITHUB_SHA. TestFlight upload is disabled."
