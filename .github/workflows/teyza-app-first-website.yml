name: Teyza app-first website checks and deployment kit
on:
  push:
    branches: [feature/teyza-app-first-website, feat/teyza-free-signup-paystack-products-promotion-20261104]
  pull_request:
    paths: ['web/app-first/**', 'tools/app-first-release/**', 'tools/seller-access/**', 'services/teyza-mobile-v39/**', 'CHECK-PILOT.ps1', 'DEPLOY-OPERATIONS.ps1', 'scripts/*app_first_website.py', 'scripts/package_teyza_premium_website.py', 'scripts/package_teyza_seller_pilot.py', 'scripts/package_teyza_seller_security_candidate.py', 'scripts/audit_teyza_seller_security_candidate.py', 'docs/TEYZA_SELLER_SECURITY_REVIEW.md', 'DEPLOY-TEYZA-PREMIUM.ps1', '.github/workflows/teyza-app-first-website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check_and_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_app_first_website.py
      - run: node --test tools/app-first-release/hosting.test.cjs tools/app-first-release/store-links.test.cjs tools/app-first-release/premium-site.test.cjs
      - run: node --check tools/app-first-release/store-links-patch.cjs
      - run: node --check tools/app-first-release/premium-site-patch.cjs
      - run: node --check tools/app-first-release/run.cjs
      - run: python3 scripts/package_app_first_website.py
      - run: python3 scripts/package_teyza_premium_website.py
      - name: Package a checked no-secrets seller pilot kit
        run: python3 scripts/package_teyza_seller_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: TEYZA-SELLER-WEBSITE-PILOT
          path: dist/TEYZA_SELLER_WEBSITE_PILOT_20261106.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: TEYZA-APP-FIRST-WEBSITE
          path: dist/TEYZA_APP_FIRST_WEBSITE_20261029.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TEYZA-PREMIUM-WEBSITE
          path: dist/TEYZA_PREMIUM_WEBSITE_20261104.zip
          if-no-files-found: error
          retention-days: 30
  powershell:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment and rollback commands
        shell: powershell
        run: |
          foreach ($file in @('DEPLOY-WEBSITE.ps1','ROLLBACK-WEBSITE.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/app-first-release/$file",[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/CHECK-PILOT.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/DEPLOY-APP-STORES.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/DEPLOY-TEYZA-PREMIUM.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
  # A second signature engine is useful evidence, not Microsoft Defender clearance.
  # Build the candidate only on the hosted CI runner; NEVER publish it as an artifact
  # while the owner's Defender report is unresolved.
  seller_security_review:
    needs: check_and_package
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build an unapproved source-only candidate without test fixtures
        run: |
          python3 scripts/package_teyza_seller_security_candidate.py
          python3 scripts/audit_teyza_seller_security_candidate.py
          node --check web/app-first/public/js/seller-web-billing.mjs
          node --check services/teyza-mobile-v39/billing-paystack.test.js
          node --check tools/app-first-release/seller-web-billing.test.cjs
          node --check services/teyza-mobile-v39/billing-paystack.js
      - name: Install independent open-source ClamAV signature scanner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
      - name: Scan exact Defender-listed JS and slim candidate (no execution)
        run: |
          clamscan --version
          clamscan --infected --recursive web/app-first/public/js/seller-web-billing.mjs services/teyza-mobile-v39/billing-paystack.test.js tools/app-first-release/seller-web-billing.test.cjs dist/TEYZA_SELLER_SECURITY_REVIEW_CANDIDATE_20261106.zip
          echo "ClamAV only: NOT a Defender false-positive determination; candidate stays unreleased."
  browser_preview:
    needs: check_and_package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA dependency
        run: npm ci --prefix tools/admin-release --no-audit --no-fund
      - name: Install Chromium
        run: |
          cd tools/admin-release
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile marketing layouts
        run: node tools/app-first-release/premium-website.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEYZA-PREMIUM-PREVIEWS
          path: premium-site-previews/*.png
          if-no-files-found: warn
          retention-days: 30
