  qa_binary_defender_scan:
    name: Scan signed QA app binaries with Defender
    if: github.event_name == 'workflow_dispatch' && inputs.qa_signing_only == true && inputs.signed_release == true && inputs.platforms == 'all'
    needs: [android, ios]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Verify Defender is active on the disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Microsoft Defender is not active; no clean binary scan can be reported.'
          }
          $preference = Get-MpPreference
          foreach ($path in @($preference.ExclusionPath)) {
            if ($path -in @('C:\', 'D:\')) {
              Remove-MpPreference -ExclusionPath $path -ErrorAction Stop
            }
          }
          $preference = Get-MpPreference
          $exclusions = @($preference.ExclusionPath; $preference.ExclusionExtension; $preference.ExclusionProcess) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (@($exclusions).Count -gt 0) {
            throw 'Defender exclusions remain on this runner; no clean binary scan can be reported.'
          }
          if ($preference.DisableArchiveScanning) {
            Set-MpPreference -DisableArchiveScanning $false -ErrorAction Stop
            if ((Get-MpPreference).DisableArchiveScanning) { throw 'Defender archive scanning is disabled.' }
          }
          try { Update-MpSignature -ErrorAction Stop | Out-Null }
          catch { Write-Warning 'Signature update failed; checking installed signature age.' }
          $status = Get-MpComputerStatus
          if (-not $status.AntivirusSignatureLastUpdated -or
              $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-3)) {
            throw 'Defender signatures are missing or older than three days.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value ('TEYZA_SCAN_START=' + (Get-Date).ToUniversalTime().ToString('o'))
          Write-Host ('Defender engine: ' + $status.AMEngineVersion + '; signatures: ' + $status.AntivirusSignatureVersion)
      - uses: actions/download-artifact@v4
        with:
          name: teyza-android-apk-qa-signed
          path: qa-apk
      - uses: actions/download-artifact@v4
        with:
          name: teyza-android-aab-qa-signed
          path: qa-aab
      - uses: actions/download-artifact@v4
        with:
          name: teyza-ios-release-qa-signed
          path: qa-ios
      - name: Scan the signed APK, AAB and IPA without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [DateTime]::Parse($env:TEYZA_SCAN_START).ToLocalTime()
          $targets = @(
            @{ Directory = 'qa-apk'; Pattern = '*.apk' },
            @{ Directory = 'qa-aab'; Pattern = '*.aab' },
            @{ Directory = 'qa-ios'; Pattern = '*.ipa' }
          )
          foreach ($target in $targets) {
            $matches = @(Get-ChildItem -LiteralPath $target.Directory -Filter $target.Pattern -File -Recurse)
            if ($matches.Count -ne 1) { throw ('Expected exactly one binary in ' + $target.Directory) }
            $path = $matches[0].FullName
            $before = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            Start-MpScan -ScanType CustomScan -ScanPath $path -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $before) {
              throw ('A binary was removed or changed during the scan: ' + $target.Directory)
            }
            Write-Host ($target.Pattern + ' SHA-256 ' + $before)
          }
          $detections = @(Get-MpThreatDetection | Where-Object {
            $_.InitialDetectionTime -ge $start -or $_.LastThreatStatusChangeTime -ge $start
          })
          if ($detections.Count -gt 0) {
            $detections | Select-Object ThreatID, InitialDetectionTime, ActionSuccess | Format-Table | Out-String | Write-Host
            throw 'Defender recorded a recent detection; do not distribute these QA binaries.'
          }
          Write-Host 'No recent Defender detection was recorded for the signed app binaries.'
          Write-Host 'This is not a Microsoft analyst verdict on the separately flagged website files.'
