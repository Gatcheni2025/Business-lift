name: Teyza Marketplace Flutter CI

on:
  pull_request:
    paths:
      - 'apps/teyza_marketplace/**'
      - '.github/workflows/teyza-marketplace-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter_android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files (staging only)
        working-directory: apps/teyza_marketplace
        run: flutter create --platforms=android --org za.co.teyza --project-name teyza_marketplace .
      - name: Resolve Dart packages
        working-directory: apps/teyza_marketplace
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: apps/teyza_marketplace
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: apps/teyza_marketplace
        run: flutter test
      - name: Build debug APK (not release-signed)
        working-directory: apps/teyza_marketplace
        run: flutter build apk --debug
      - name: Save internal APK build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teyza-marketplace-debug-apk
          path: apps/teyza_marketplace/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
