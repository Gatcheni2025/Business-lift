name: Teyza scoped deployment dependency remediation candidate
on:
  workflow_dispatch:
  push:
    branches:
      - security/teyza-deploy-cli-dependency-upgrade-20261110
permissions:
  contents: read
jobs:
  prepare-reviewed-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile WITHOUT running dependency install scripts
        working-directory: tools/app-first-release
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install from generated lockfile
        working-directory: tools/app-first-release
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and Hosting preservation tests
        working-directory: tools/app-first-release
        run: npm test
      - name: Record production dependency security audit
        shell: bash
        working-directory: tools/app-first-release
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const a=require('./npm-audit-production.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities||{}, null, 2));"
      - name: Upload lockfile and audit evidence for review (NO auto commit)
        uses: actions/upload-artifact@v4
        with:
          name: teyza-cli-lockfile-review-candidate
          path: |
            tools/app-first-release/package.json
            tools/app-first-release/package-lock.json
            tools/app-first-release/npm-audit-production.json
          if-no-files-found: error
          retention-days: 14
