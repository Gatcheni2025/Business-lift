name: Upload signed Teyza IPA to TestFlight

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Reviewed successful signed iOS build run'
        required: true
        type: string
      expected_source_sha:
        description: 'Exact reviewed source commit SHA'
        required: true
        type: string
      expected_version:
        description: 'Expected iOS version and build, e.g. 1.0.51+61'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: teyza-testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Gatcheni2025/Business-lift' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Verify reviewed source run and signed artifact provenance
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = 'Gatcheni2025/Business-lift'
          run_id = os.environ['SOURCE_RUN_ID']
          sha = os.environ['EXPECTED_SOURCE_SHA']
          version = os.environ['EXPECTED_VERSION']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('Invalid source run ID.')
          if not re.fullmatch(r'[a-f0-9]{40}', sha):
              raise SystemExit('Expected exact reviewed 40-character source SHA.')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+', version):
              raise SystemExit('Expected exact app version+build.')
          def get(endpoint):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + endpoint,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = get('/actions/runs/' + run_id)
          if (str(run.get('id')) != run_id or
              (run.get('repository') or {}).get('full_name') != repo or
              (run.get('head_repository') or {}).get('full_name') != repo or
              run.get('head_sha') != sha or run.get('status') != 'completed' or
              run.get('conclusion') != 'success' or
              run.get('path','').split('@')[0] not in (
                  '.github/workflows/teyza-mobile-release.yml',
                  '.github/workflows/teyza-store-files.yml') or
              run.get('event') not in ('workflow_dispatch','push')):
              raise SystemExit('Source run provenance does not match approved release.')
          listing = get('/actions/runs/' + run_id + '/artifacts?name=teyza-ios-release-signed&per_page=100')
          artifacts = listing.get('artifacts', [])
          if (listing.get('total_count') != 1 or len(artifacts) != 1 or
              artifacts[0].get('name') != 'teyza-ios-release-signed' or
              artifacts[0].get('expired') is not False):
              raise SystemExit('Expected exactly one available production-signed iOS artifact.')
          print('Verified reviewed run', run_id, 'artifact', artifacts[0]['id'])
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: teyza-ios-release-signed
          path: ${{ runner.temp }}/teyza-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signed release manifest and IPA identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'apps/teyza_shopper/scripts')
          from upload_testflight import verify
          root = Path(os.environ['RUNNER_TEMP']) / 'teyza-artifact'
          manifests = list(root.rglob('release-manifest.json'))
          packages = list(root.rglob('*.ipa'))
          if len(manifests) != 1 or len(packages) != 1:
              raise SystemExit('Expected one release manifest and one IPA.')
          manifest = json.loads(manifests[0].read_text())
          if (manifest.get('commit') != os.environ['EXPECTED_SOURCE_SHA'] or
              manifest.get('version') != os.environ['EXPECTED_VERSION'] or
              manifest.get('releasePurpose') != 'production_candidate' or
              manifest.get('productionBackendGateVerified') is not True or
              manifest.get('paymentChannel') != 'store' or
              manifest.get('inAppDigitalSubscriptionPurchasesEnabled') is not False):
              raise SystemExit('Artifact is not the reviewed production candidate.')
          package = verify(manifests[0].parent)
          if package.resolve() != packages[0].resolve() or '\n' in str(package) or '\r' in str(package):
              raise SystemExit('Unexpected IPA path.')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEYZA_IPA='+str(package)+'\n')
          PY
      - name: Check upload credentials are configured
        env:
          ASC_KEY_ID: ${{ secrets.TEYZA_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.TEYZA_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.TEYZA_ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          if any(not os.environ.get(k) for k in ('ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY')):
              raise SystemExit('Run Teyza Apple upload credentials in asiye_app before uploading.')
          PY
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Apple uploader
        run: gem install fastlane --no-document
      - name: Upload to TestFlight without submitting for review
        env:
          ASC_KEY_ID: ${{ secrets.TEYZA_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.TEYZA_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.TEYZA_ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'teyza-asc.json'
          p.write_text(json.dumps({'key_id':os.environ['ASC_KEY_ID'].strip(),
              'issuer_id':os.environ['ASC_ISSUER_ID'].strip(),
              'key':os.environ['ASC_PRIVATE_KEY'],'in_house':False}))
          p.chmod(0o600)
          PY
          fastlane pilot upload --api_key_path "$RUNNER_TEMP/teyza-asc.json" --ipa "$TEYZA_IPA" --app_identifier za.co.teyza.shopper --apple_id 6827037733 --skip_waiting_for_build_processing true
      - name: Remove temporary upload material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/teyza-asc.json"
          rm -rf "$RUNNER_TEMP/teyza-artifact"
