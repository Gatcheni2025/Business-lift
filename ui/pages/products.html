<section class="section-card" id="new-product"><p class="eyebrow">Catalog</p><h2>Add a product</h2><p>Save your product and choose its connected sales channels.</p><form data-product-form><div class="form-grid"><label class="input-label">Product name<input name="name" type="text" required></label><label class="input-label">SKU<input name="sku" type="text" required></label><label class="input-label">Category<input name="category" type="text" required></label><label class="input-label">Price (ZAR)<input name="price" type="number" min="0" step="0.01" required></label><label class="input-label">Cost price (ZAR)<input name="costPrice" type="number" min="0" step="0.01" required></label><label class="input-label">Stock<input name="stock" type="number" min="0" step="1" required></label></div><label class="input-label">Description<textarea name="description" required></textarea></label><label class="input-label">Image URL<input type="url" name="imageUrl"></label><label class="input-label">Status<select name="status"><option value="active">Active</option><option value="draft">Draft</option></select></label><fieldset><legend>Sales channels</legend><div data-channel-toggles>Loading connected channels…</div></fieldset><div class="auth-actions"><button class="button button-primary" type="submit">Add Product</button><a href="sales-channels.html?return=dashboard">Manage sales channels</a></div></form><p data-product-status role="status" hidden></p></section><section class="section-card"><h2>Your inventory</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Cost</th><th>Stock</th><th>Channels</th><th>Status</th><th>Actions</th></tr></thead><tbody data-products-table-body><tr><td colspan="8">Loading products…</td></tr></tbody></table></div></section>
