<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Settings | Business Expo</title><script src="https://unpkg.com/@phosphor-icons/web"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f8fafc;color:#0f172a;font-family:Inter,sans-serif}.wrap{max-width:820px;margin:auto;padding:26px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-family:'Plus Jakarta Sans';font-weight:800}.top a{color:#2563eb;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px}.card h1{font-family:'Plus Jakarta Sans';margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:.82rem;font-weight:800}.field input,.field textarea{padding:12px;border:1px solid #e2e8f0;border-radius:10px;font:inherit}.field textarea{min-height:120px;resize:vertical}.wide{grid-column:1/-1}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}.status{margin-left:10px;color:#16a34a;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Business Expo</div><a href="dashboard.html">Dashboard</a></div><div class="card"><h1>Shop settings</h1><p style="color:#64748b">Keep this simple: basic contact details, customer service and order notifications.</p><div class="grid"><div class="field"><label>Shop name</label><input id="shopName"></div><div class="field"><label>Support email</label><input id="supportEmail" type="email"></div><div class="field"><label>Support phone</label><input id="supportPhone"></div><div class="field wide"><label>Returns / refund policy</label><textarea id="returnsPolicy" placeholder="Explain how returns or refunds work"></textarea></div></div><div class="checks"><label><input id="orderNotifications" type="checkbox" checked> Order notifications</label><label><input id="lowStockNotifications" type="checkbox" checked> Low stock notifications</label></div><button class="btn" id="saveShop">Save settings</button><span class="status" id="saveStatus"></span></div></div><script type="module" src="js/shop-settings.js"></script></body></html>
