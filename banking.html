<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banking Details | Business Expose</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css"> <!-- Uses your global styles -->
    <style>
        .bank-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: 16px; padding: 32px; margin-bottom: 32px; position: relative; overflow: hidden; }
        .bank-card::after { content: ''; position: absolute; top: -50%; right: -10%; width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #475569; }
        .input-group input, .input-group select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #e2e8f0; font-family: 'Inter'; outline: none; }
        .input-group input:focus { border-color: #2563eb; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body class="app-shell" style="display:flex; height:100vh; background:#f8fafc; margin:0; font-family:'Inter',sans-serif;">

    <aside class="sidebar" style="width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 24px;">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:32px;">
            <div style="background:linear-gradient(135deg,#2563eb,#8b5cf6); color:white; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold;">BE</div>
            <strong style="font-family:'Plus Jakarta Sans'; font-size:1.2rem;">Business Expose</strong>
        </div>
        <a href="dashboard.html" style="display:block; padding:12px; color:#64748b; text-decoration:none; border-radius:8px;"><i class="ph ph-rocket-launch"></i> Expose Product</a>
        <p style="font-size:0.75rem; font-weight:700; color:#64748b; margin: 20px 0 10px 10px; text-transform:uppercase;">Operations</p>
        <a href="track-sales.html" style="display:block; padding:12px; color:#64748b; text-decoration:none; border-radius:8px;"><i class="ph ph-chart-line-up"></i> Track Sales</a>
        <a href="banking.html" style="display:block; padding:12px; color:white; background:#2563eb; text-decoration:none; border-radius:8px; font-weight:500;"><i class="ph ph-bank"></i> Banking Details</a>
        <a href="delivery.html" style="display:block; padding:12px; color:#64748b; text-decoration:none; border-radius:8px;"><i class="ph ph-truck"></i> Delivery Tracker</a>
        <a href="accounting.html" style="display:block; padding:12px; color:#64748b; text-decoration:none; border-radius:8px;"><i class="ph ph-calculator"></i> Accounting</a>
    </aside>

    <main style="flex:1; padding: 40px; overflow-y:auto;">
        <h1 style="font-family:'Plus Jakarta Sans'; font-size:1.8rem; margin-bottom: 8px;">Banking & Payouts</h1>
        <p style="color:#64748b; margin-bottom: 32px;">Manage where your Expose API funds are deposited.</p>

        <div class="bank-card">
            <h3 style="color:#94a3b8; font-size:0.9rem; text-transform:uppercase; margin-bottom:8px;">Available Balance for Payout</h3>
            <h1 style="font-family:'Plus Jakarta Sans'; font-size:3rem; margin-bottom:16px;">R 12,450.00</h1>
            <button style="background:white; color:#0f172a; border:none; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer;">Withdraw Funds</button>
        </div>

        <div style="background:white; border:1px solid #e2e8f0; border-radius:16px; padding:32px;">
            <h2 style="font-family:'Plus Jakarta Sans'; margin-bottom:24px;">Linked Bank Account</h2>
            <form>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Bank Name</label>
                        <select><option>FNB</option><option>Standard Bank</option><option>Capitec</option><option>Absa</option></select>
                    </div>
                    <div class="input-group">
                        <label>Account Type</label>
                        <select><option>Business Cheque</option><option>Savings</option></select>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Account Number</label>
                        <input type="text" placeholder="e.g. 62812345678">
                    </div>
                    <div class="input-group">
                        <label>Branch Code</label>
                        <input type="text" placeholder="e.g. 250655">
                    </div>
                </div>
                <button type="button" class="btn-primary">Securely Save Details</button>
                <p style="font-size:0.8rem; color:#10b981; margin-top:12px;"><i class="ph ph-lock-key"></i> 256-bit Bank Level Encryption</p>
            </form>
        </div>
    </main>
</body>
</html>
