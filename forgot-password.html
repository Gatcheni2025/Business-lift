<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Business Lift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-panel">
            <p class="eyebrow">Password recovery</p>
            <h1>Reset account access.</h1>
            <p>Send a secure Firebase password reset email without building your own recovery workflow.</p>

            <form data-auth="reset">
                <label class="input-label">
                    Email address
                    <input type="email" name="email" placeholder="you@business.com" required>
                </label>
                <div class="auth-actions">
                    <button class="button button-primary" type="submit">Send reset link</button>
                    <a class="link-inline" href="login.html">Back to login</a>
                </div>
            </form>
            <p class="form-status" data-auth-status hidden></p>
        </section>

        <aside class="auth-aside">
            <p class="eyebrow">Recovery flow</p>
            <h2>Keep the auth journey complete from day one.</h2>
            <p>This page closes the loop for future authentication and account support workflows.</p>
        </aside>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
