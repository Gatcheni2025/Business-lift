<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Business Expo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/workspace.css?v=2">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-panel"><a class="brand" href="index.html"><span class="brand-mark">BE</span><strong>Business Expo</strong></a>
            <p class="eyebrow">Password recovery</p>
            <h1>Reset account access.</h1>
            <p>Enter your account email and we’ll send you a link to reset your password.</p>

            <form data-auth="reset">
                <label class="input-label">
                    Email address
                    <input type="email" name="email" autocomplete="email" placeholder="you@business.com" required>
                </label>
                <div class="auth-actions">
                    <button class="button button-primary" type="submit">Send reset link</button>
                    <a class="link-inline" href="login.html">Back to login</a>
                </div>
            </form>
            <p class="form-status" data-auth-status role="status" aria-live="polite" hidden></p>
        </section>

        <aside class="auth-aside">
            <p class="eyebrow">Recovery flow</p>
            <h2>Get back to your business.</h2>
            <p>After resetting your password, return to sign in with your new password.</p>
        </aside>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
