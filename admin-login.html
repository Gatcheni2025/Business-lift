<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Teyza</title><link rel="stylesheet" href="assets/workspace.css?v=10"><style>body{margin:0;background:#f4f7fb}.admin-login{min-height:100vh;display:grid;place-items:center;padding:24px}.admin-login-card{width:min(430px,100%);background:#fff;border:1px solid #dde4ee;border-radius:20px;padding:34px;box-shadow:0 18px 60px #07142f12}.admin-brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.admin-login-card h1{margin-bottom:6px}.admin-login-card .input-label{display:block;margin:16px 0}.admin-login-card .button{width:100%;justify-content:center}.admin-note{margin-top:20px;padding:12px;border-radius:10px;background:#f6f8fc;font-size:12px}</style></head><body><main class="admin-login"><section class="admin-login-card"><div class="admin-brand"><span class="teyza-logo-mark"><span>T</span></span><span class="teyza-word">TEYZA<small>ADMINISTRATION</small></span></div><span class="eyebrow">SECURE ADMIN PORTAL</span><h1>Sign in to Teyza Admin</h1><p>Use your authorised administrator account.</p><form data-admin-login><label class="input-label">Admin email<input name="email" type="email" autocomplete="username" required></label><label class="input-label">Password<input name="password" type="password" autocomplete="current-password" required></label><div class="form-status" data-admin-status hidden></div><button class="button button-primary" type="submit">Sign in to Admin</button></form><div class="admin-note">Seller accounts cannot access this portal unless a Super Admin has granted them an administrator role.</div></section></main><script type="module" src="js/admin-login.js"></script></body></html>
