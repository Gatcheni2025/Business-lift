// CI-only group-scoped fallback for Kotlin compiler artifact GitHub 504.
// Firebase code, payment processing, signing identity and local builds untouched.
// Flutter's included Gradle plugin build prefers SETTINGS repositories; never
// inject project repositories or override its FAIL_ON_PROJECT_REPOS guard.
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories.maven {
        name = 'teyzaCIKotlinPluginMirror'
        url = uri('https://maven.aliyun.com/repository/central')
        content { includeGroup('org.jetbrains.kotlin') }
    }
    settings.dependencyResolutionManagement.repositories.maven {
        name = 'teyzaCIKotlinCompilerMirror'
        url = uri('https://maven.aliyun.com/repository/central')
        content { includeGroup('org.jetbrains.kotlin') }
    }
}
