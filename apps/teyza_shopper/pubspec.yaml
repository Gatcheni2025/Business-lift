name: teyza_shopper
description: Teyza Shopper - discover spaza shops, variety stores and verified local stock.
publish_to: none
version: 1.0.1+11

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  http: ^1.3.0
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.4
  geocoding: ^4.0.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/teyza-sprout-wordmark-light.svg
    - assets/brand/teyza-sprout-icon.svg
