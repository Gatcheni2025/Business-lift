name: teyza_shopper
description: Teyza Shopper - discover spaza shops, variety stores and verified local stock.
publish_to: none
version: 1.0.17+27

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  http: ^1.3.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.6
  image_picker: ^1.2.4
  camera: 0.12.1
  firebase_auth: 6.5.4
  firebase_core: 4.11.0
  firebase_messaging: 16.4.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.4
  geocoding: ^4.0.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/firebase_native.json
    - assets/catalogue/
    - assets/brand/teyza-sprout-wordmark-light.svg
    - assets/brand/teyza-sprout-icon.svg
    - assets/brand/teyza-sprout-wordmark.svg
    - assets/illustrations/
    - assets/images/
    - assets/images/essentials/
  fonts:
    - family: PT Sans
      fonts:
        - asset: assets/fonts/PTSans-Regular.ttf
        - asset: assets/fonts/PTSans-Bold.ttf
          weight: 700
