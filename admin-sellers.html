<!doctype html><html lang="en"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller approvals | Teyza Admin</title><link rel="stylesheet" href="assets/workspace.css?v=9"><style>
.admin-shell{max-width:1240px;margin:40px auto;padding:0 20px}.seller-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;box-shadow:0 14px 36px rgba(15,23,42,.05)}.seller-heading{display:flex;gap:14px;align-items:center}.seller-heading h2{margin:0 0 3px}.seller-meta,.review-checklist{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.seller-actions{display:flex;gap:9px;align-items:stretch;flex-direction:column}.seller-actions .button{width:100%}.seller-logo{width:58px;height:58px;border-radius:15px;object-fit:cover;background:#eef2f5}.seller-logo-empty{display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(135deg,#1ed7dd,#168cff 32%,#6739e6 62%,#e633ae)}.approval-pending{color:#8a6500}.approval-approved{color:#087f5b}.approval-rejected{color:#b42318}.review-chip{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#f3f5f8;color:#687386}.review-chip.done{background:#e9f8f1;color:#087f5b}.review-chip.pending{background:#fff7e8;color:#8a6500}.address-review{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.address-review>div{padding:12px;border:1px solid #e4e9ef;border-radius:11px;background:#f9fbfc}.address-review span{display:block;font-size:10px;color:#7b8798;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.address-review strong{display:block;font-size:12px;line-height:1.5}.address-review .ok{color:#087f5b}.address-review .bad{color:#b42318}.address-review .wait{color:#8a6500}.seller-about{color:#667085}.approval-note{font-size:12px;color:#8a6500;background:#fff8e8;border:1px solid #f2dfad;padding:10px 12px;border-radius:10px}.address-ok{border-color:#b5dfcb!important;color:#087f5b!important}.button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:850px){.seller-card{grid-template-columns:1fr}.seller-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.address-review{grid-template-columns:1fr}}@media(max-width:520px){.seller-actions{grid-template-columns:1fr}}
</style></head><body><main class="admin-shell"><div style="display:flex;justify-content:space-between;align-items:center"><a href="admin-dashboard.html">← Admin dashboard</a><button class="button" data-admin-logout>Sign out</button></div><span class="eyebrow">TEYZA ADMIN</span><h1>Seller company approvals</h1><p>Review seller business profiles before their products can be published.</p><div class="workspace-alert" data-admin-status hidden></div><div data-sellers>Loading sellers…</div></main><script type="module" src="js/admin-sellers.js?v=2"></script></body></html>
