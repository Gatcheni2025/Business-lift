<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Network | Business Expo</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.wrap{max-width:880px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans';font-weight:800}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#8b5cf6);color:#fff;display:grid;place-items:center}.top a{color:var(--blue);font-weight:800;text-decoration:none}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border-radius:22px;padding:26px;margin-bottom:16px}.hero h1{font-family:'Plus Jakarta Sans';margin:0 0 8px}.hero p{margin:0;color:#dbeafe;line-height:1.6}.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.8rem;font-weight:800}.field input,.field textarea{padding:11px 12px;border:1px solid var(--border);border-radius:10px;font:inherit}.field textarea{min-height:110px;resize:vertical}.switches{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:#475569;font-size:.88rem}.btn{margin-top:16px;border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:white;font-weight:800;cursor:pointer}.status{margin-left:10px;font-size:.82rem;color:#166534;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><div class="logo">BE</div>Business Expo</div><a href="dashboard.html">Dashboard</a></div>
  <section class="hero"><h1>Business Network</h1><p>Tell other businesses what you offer and what you need. This profile helps Business Expo match you with suppliers, distributors, customers and collaborators.</p></section>
  <section class="panel">
    <div class="grid">
      <div class="field"><label>Business category</label><input id="category" placeholder="e.g. Clothing, logistics, catering" /></div>
      <div class="field"><label>Service area</label><input id="serviceArea" placeholder="e.g. Durban, KZN, nationwide" /></div>
      <div class="field full"><label>What do you offer?</label><textarea id="offers" placeholder="Products, services, capacity or opportunities you can provide"></textarea></div>
      <div class="field full"><label>What are you looking for?</label><textarea id="needs" placeholder="Suppliers, distributors, partners, clients or other support"></textarea></div>
    </div>
    <div class="switches"><label><input type="checkbox" id="discoverable" checked /> Show my business in the network</label><label><input type="checkbox" id="allowContact" checked /> Allow businesses to contact me</label></div>
    <button class="btn" id="saveNetwork">Save network profile</button><span class="status" id="networkStatus"></span>
  </section>
</div>
<script type="module" src="js/network.js"></script>
</body>
</html>
